<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>webyak</title>
    <!--
      Installable: the manifest, and what iOS reads instead of it.
      docs/ARCHITECTURE.md#installable-and-an-offline-shell
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="webyak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      The service worker (public/sw.js), for built bundles only. The dev
      server's bundle isn't under /_expo/static/, and a worker caching it
      would serve a stale bundle and break hot reload.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          if (!document.querySelector('script[src*="/_expo/static/js/"]')) return;
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run webyak.</noscript>
    <div id="root"></div>
  </body>
</html>
