<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>webyak</title>
    <meta
      name="description"
      content="An unofficial, open-source web client for Yik Yak. Your feeds, chats and alerts on any computer, and a searchable archive of everything you've seen."
    />
    <!--
      The link preview on Discord, iMessage, Slack, X and the like.
      docs/ARCHITECTURE.md#link-previews

      Unfurlers run no JavaScript, so these have to be in the file, and every
      deep link gets the same card: GitHub Pages serves this page (as 404.html)
      for /p/<id> too. No og:url for that reason, since it would claim every
      shared post is the home page. og:image must be absolute, so it names the
      live site rather than BASE_URL in src/lib/share.ts, which HTML can't read.
      The image is drawn by assets/brand/render-icons.py.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="webyak" />
    <meta property="og:title" content="webyak" />
    <meta
      property="og:description"
      content="An unofficial, open-source web client for Yik Yak. Your feeds, chats and alerts on any computer, and a searchable archive of everything you've seen."
    />
    <meta property="og:image" content="https://webyak.vbjfr.xyz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The webyak logo, a laptop outline on a green tile, beside the words: webyak. Yik Yak, on the web. Unofficial, open source."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Installable: the manifest, and what iOS reads instead of it.
      docs/ARCHITECTURE.md#installable-and-an-offline-shell
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="webyak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      The service worker (public/sw.js), for built bundles only. The dev
      server's bundle isn't under /_expo/static/, and a worker caching it
      would serve a stale bundle and break hot reload.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          if (!document.querySelector('script[src*="/_expo/static/js/"]')) return;
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run webyak.</noscript>
    <div id="root"></div>
  </body>
</html>
